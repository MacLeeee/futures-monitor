name: Update Futures Data

# 每半小时有两次触发机会，降低单次被跳过概率（如 14:35 常被跳过）
# 主: :05/:35（BJ 13:05/13:35/14:05/14:35…） 备: :10/:40（BJ 13:10/13:40/14:10/14:40…）
# 非交易时段脚本立即退出 (exit 0)，不抓数据、不提交、不推送
on:
  schedule:
    - cron: "5,35 * * * *"
    - cron: "10,40 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "futures-monitor/public/data.json"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Python dependencies
        run: pip install -r requirements.txt --quiet

      # 抓取行情 + 计算指标 → 写入 data.json → Telegram 推送
      # 手动触发（workflow_dispatch）时自动设 FORCE_FETCH=1，跳过交易时间校验
      - name: Fetch & calculate
        run: python scripts/fetch_and_calc.py
        env:
          FORCE_FETCH: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}

      # data.json 有变化才提交，触发 Cloudflare Pages 重新构建
      - name: Commit data.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add futures-monitor/public/data.json
          git diff --quiet && git diff --staged --quiet \
            || git commit -m "chore: update futures data"
          git push
