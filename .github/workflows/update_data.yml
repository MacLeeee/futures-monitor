name: Update Futures Data

# ─── cron 说明 ────────────────────────────────────────────────────────────────
# 只用一条 cron 表达式（多条 schedule 条目会互相 cancel，反而更不可靠）
# 在每小时的 :25/:35 和 :55/:05 触发，恰好覆盖 :30 前后 5 分钟 + :00 前后 5 分钟
#   :25 / :55  → 半小时 K 线即将收口，提前预热
#   :35 / :05  → 半小时 K 线已收口，主力抓取时机
# 避开 :00/:30 整点（GitHub 全局负载峰值，最容易被跳过/延迟）
# 非交易时段由 Python is_trading_time() 守卫立即退出，不抓数据、不提交
on:
  schedule:
    - cron: "5,25,35,55 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "futures-monitor/public/data.json"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Python dependencies
        run: pip install -r requirements.txt --quiet

      # 抓取行情 + 计算指标 → 写入 data.json → Telegram 推送
      # 手动触发（workflow_dispatch）时自动设 FORCE_FETCH=1，跳过交易时间校验
      - name: Fetch & calculate
        run: python scripts/fetch_and_calc.py
        env:
          FORCE_FETCH: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}

      # data.json 有变化才提交，触发 Cloudflare Pages 重新构建
      - name: Commit data.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add futures-monitor/public/data.json
          git diff --quiet && git diff --staged --quiet \
            || git commit -m "chore: update futures data"
          git push
