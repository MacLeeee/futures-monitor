name: Update Futures Data

# 中国期货交易时段（北京时间 = UTC+8）
# 早盘: 09:00-11:30 BJ = 01:00-03:30 UTC
# 午盘: 13:30-15:00 BJ = 05:30-07:00 UTC
# 夜盘: 21:00-23:30 BJ = 13:00-15:30 UTC
# 每 30 分钟一次，仅周一至周五（cron 用 5 字段：分 时 日 月 周）
on:
  schedule:
    - cron: "0,30 1,2,3 * * 1-5"    # 早盘 09:00-11:00 BJ (01:00-03:30 UTC)
    - cron: "30 3 * * 1-5"          # 早盘 11:30 BJ (03:30 UTC)
    - cron: "30 5 * * 1-5"          # 午盘 13:30 BJ (05:30 UTC)
    - cron: "0,30 6 * * 1-5"        # 午盘 14:00-14:30 BJ (06:00-06:30 UTC)
    - cron: "0 7 * * 1-5"           # 午盘 15:00 BJ (07:00 UTC)
    - cron: "0,30 13,14,15 * * 1-5" # 夜盘 21:00-23:00 BJ (13:00-15:00 UTC)
    - cron: "30 15 * * 1-5"         # 夜盘 23:30 BJ (15:30 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Python dependencies
        run: pip install -r requirements.txt --quiet

      # 抓取行情 + 计算指标 → 写入 data.json
      # 手动触发（workflow_dispatch）时自动设 FORCE_FETCH=1，跳过交易时间校验
      - name: Fetch & calculate
        run: python scripts/fetch_and_calc.py
        env:
          FORCE_FETCH: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}

      # data.json 有变化才提交，触发 Cloudflare Pages 重新构建
      - name: Commit data.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add futures-monitor/public/data.json
          git diff --quiet && git diff --staged --quiet \
            || git commit -m "chore: update futures data"
          git push
