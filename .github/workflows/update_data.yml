name: Update Futures Data

# 改为本地脚本（run_local.sh）手动驱动，GitHub Actions 仅保留 workflow_dispatch
# 供紧急时从 GitHub 网页手动触发，不再使用 cron
on:
  workflow_dispatch:
    inputs:
      force:
        description: '强制执行（绕过交易时间校验）'
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - "futures-monitor/public/data.json"
      - "futures-monitor/public/data_daily.json"

permissions:
  contents: write

# 同一时刻只允许一个 job 运行，取消排队中的旧任务（始终保留最新一次）
# 防止 :25/:35 两次 cron 并发导致 git push non-fast-forward 错误从而崩溃 workflow
concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Python dependencies
        run: pip install -r requirements.txt --quiet

      # ── 仅 workflow_dispatch（手动触发）才抓行情数据 ──────────────
      # push 触发时跳过数据抓取，避免与 run_local.sh 产生竞争覆盖
      # （Cloudflare Pages 监听 GitHub 仓库，会自动部署最新前端代码）
      - name: Fetch & calculate
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/fetch_and_calc.py
        env:
          FORCE_FETCH: ${{ inputs.force == true && '1' || '0' }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID_2:   ${{ secrets.TELEGRAM_CHAT_ID_2 }}

      - name: Commit data
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add futures-monitor/public/data.json futures-monitor/public/data_daily.json futures-monitor/public/positions.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "[SKIP] 数据无变化，跳过 commit"
            exit 0
          fi
          git commit -m "chore: update futures data"
          git fetch origin main
          git merge origin/main --no-edit -X ours
          git push origin main
