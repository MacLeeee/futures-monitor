name: Update Futures Data

# 中国期货交易时段（北京时间 = UTC+8，BJ = UTC+8）
# 早盘: 09:00-11:30 BJ → UTC 01:00-03:30
# 午盘: 13:30-15:00 BJ → UTC 05:30-07:00
# 夜盘: 21:00-23:30 BJ → UTC 13:00-15:30
# GitHub cron 严格 5 字段: 分 时 日 月 周(1=Mon)
on:
  schedule:
    # ── 早盘 ──────────────────────────────
    - cron: "0 1 * * 1-5"    # 09:00 BJ
    - cron: "30 1 * * 1-5"   # 09:30 BJ
    - cron: "0 2 * * 1-5"    # 10:00 BJ
    - cron: "30 2 * * 1-5"   # 10:30 BJ
    - cron: "0 3 * * 1-5"    # 11:00 BJ
    - cron: "30 3 * * 1-5"   # 11:30 BJ
    # ── 午盘 ──────────────────────────────
    - cron: "30 5 * * 1-5"   # 13:30 BJ
    - cron: "0 6 * * 1-5"    # 14:00 BJ
    - cron: "30 6 * * 1-5"   # 14:30 BJ
    - cron: "0 7 * * 1-5"    # 15:00 BJ
    # ── 夜盘 ──────────────────────────────
    - cron: "0 13 * * 1-5"   # 21:00 BJ
    - cron: "30 13 * * 1-5"  # 21:30 BJ
    - cron: "0 14 * * 1-5"   # 22:00 BJ
    - cron: "30 14 * * 1-5"  # 22:30 BJ
    - cron: "0 15 * * 1-5"   # 23:00 BJ
    - cron: "30 15 * * 1-5"  # 23:30 BJ
  workflow_dispatch:
  # push 到 main 时也触发一次，保持仓库活跃（防止 GitHub 因不活跃而跳过 cron）
  push:
    branches: [main]
    paths-ignore:
      - "futures-monitor/public/data.json"  # data.json 自身的提交不再触发，避免死循环

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Python dependencies
        run: pip install -r requirements.txt --quiet

      # 抓取行情 + 计算指标 → 写入 data.json → Telegram 推送
      # 手动触发（workflow_dispatch）时自动设 FORCE_FETCH=1，跳过交易时间校验
      - name: Fetch & calculate
        run: python scripts/fetch_and_calc.py
        env:
          FORCE_FETCH: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}

      # data.json 有变化才提交，触发 Cloudflare Pages 重新构建
      - name: Commit data.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add futures-monitor/public/data.json
          git diff --quiet && git diff --staged --quiet \
            || git commit -m "chore: update futures data"
          git push
