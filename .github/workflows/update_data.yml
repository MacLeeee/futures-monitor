name: Update Futures Data

# ─── cron 说明 ────────────────────────────────────────────────────────────────
# 只用一条 cron 表达式（多条 schedule 条目会互相 cancel，反而更不可靠）
# 在每小时的 :25/:35 和 :55/:05 触发，恰好覆盖 :30 前后 5 分钟 + :00 前后 5 分钟
#   :25 / :55  → 半小时 K 线即将收口，提前预热
#   :35 / :05  → 半小时 K 线已收口，主力抓取时机
# 避开 :00/:30 整点（GitHub 全局负载峰值，最容易被跳过/延迟）
# 非交易时段由 Python is_trading_time() 守卫立即退出，不抓数据、不提交
on:
  schedule:
    - cron: "5,25,35,55 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: '强制执行（绕过交易时间校验，用于手动测试）'
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - "futures-monitor/public/data.json"

permissions:
  contents: write

# 同一时刻只允许一个 job 运行，取消排队中的旧任务（始终保留最新一次）
# 防止 :25/:35 两次 cron 并发导致 git push non-fast-forward 错误从而崩溃 workflow
concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Python dependencies
        run: pip install -r requirements.txt --quiet

      # 抓取行情 + 计算指标 → 写入 data.json → Telegram 推送
      # FORCE_FETCH=1 仅在手动勾选 force=true 时生效，keepalive 自动触发不绕过交易时间
      - name: Fetch & calculate
        run: python scripts/fetch_and_calc.py
        env:
          FORCE_FETCH: ${{ inputs.force == true && '1' || '0' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}

      # data.json 有变化才提交；pull --rebase 防止并发 push 冲突导致 workflow 崩溃
      - name: Commit data.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add futures-monitor/public/data.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "[SKIP] data.json 无变化，跳过 commit"
            exit 0
          fi
          git commit -m "chore: update futures data"
          git pull --rebase origin main
          git push
