name: Update Futures Data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Python dependencies
        run: pip install -r requirements.txt --quiet

      # 抓取行情 + 计算指标 → 写入 data.json
      - name: Fetch & calculate
        run: python scripts/fetch_and_calc.py

      # 将 data.json 提交回仓库，触发 Cloudflare Pages 自动构建
      # 注意：不加 [skip ci]，让 Cloudflare 重新构建以更新静态文件
      - name: Commit data.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add futures-monitor/public/data.json
          git diff --quiet && git diff --staged --quiet \
            || git commit -m "chore: update futures data"
          git push
